build:
  platform: x86
  platform_type: '64'
  openwrt_version: 24.10.1
  directory: files

apu-g01:
  apu_id: '01'
  profile: 'generic'
  hostname: 'alidade'
  packages: 'pciutils luci-proto-wireguard luci-ssl iperf3 git openssh-client-utils openssh-client openssh-server openssh-sftp-server python3 picocom kmod-usb-net-cdc-ether kmod-usb-net-qmi-wwan uqmi kmod-usb-net-cdc-mbim umbim rsync kmod-usb-serial-option picocom usbutils e2fsprogs fdisk kmod-fs-ext4 gdisk block-mount fdisk'

