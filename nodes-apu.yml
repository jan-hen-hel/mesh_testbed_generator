build:
  platform: x86
  platform_type: '64'
  openwrt_version: 24.10.1
  directory: files
  packages: 'openssh-sftp-server qmi-utils kmod-usb-serial-sierrawireless luci-proto-qmi dockerd docker luci-ssl iperf3 git openssh-sftp-server python3 picocom kmod-usb-net-qmi-wwan kmod-usb-serial-option picocom usbutils e2fsprogs kmod-fs-ext4 block-mount cfdisk'
  profile: 'generic'

